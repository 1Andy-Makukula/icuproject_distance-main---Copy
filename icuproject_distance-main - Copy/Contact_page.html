	 <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, white, #e6e1e1, #a3aade);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .container:hover {
            box-shadow: 0px 0px 20px rgba(255, 255, 255, 0.3);
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            text-align: left;
            color: #222;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ddd;
            transition: all 0.3s ease;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
        }
        input:hover, textarea:hover {
            border-color: #555;
            background-color: rgba(255, 255, 255, 0.7);
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #555;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: white;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: rgb(69, 69, 210);">Contact Us</h2>
        <form id="contactForm">
            <label style="color: rgb(69, 69, 210);">Your Name:</label>
            <input type="text" id="name" required>

            <label style="color: rgb(69, 69, 210);">Email Address:</label>
            <input type="email" id="email" required>

            <label style="color: rgb(69, 69, 210);">Phone Number (Optional):</label>
            <input type="tel" id="phone">

            <label style="color: rgb(69, 69, 210);">Subject (Optional):</label>
            <input type="text" id="subject">

            <label style="color: rgb(69, 69, 210);">Your Message:</label>
            <textarea id="message" rows="4" required></textarea>

            <button type="button" onclick="submitContactForm()">Send</button>
        </form>
    </div>

    <script>
        function submitContactForm() {
            const contactData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value || "Not provided",
                subject: document.getElementById("subject").value || "No subject",
                message: document.getElementById("message").value
            };

            console.log("Submitted Contact Inquiry:", contactData);
            alert("Your message has been sent successfully!");
        }
    </script>
</body>
